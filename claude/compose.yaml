
services:
  claude:
    build: .
    container_name: claude-box
    init: true
    working_dir: /workspace
    ports:
      - "8020:8080"   # WireMock
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach host services, e.g. http://host.docker.internal:8000
    environment:
      AMQP_HOST: rabbitmq
      DOCKER_HOST: unix:///run/dind/docker.sock   # the "docker" sidecar below, not the host daemon
    depends_on:
      - docker
#    depends_on:
#      rabbitmq:
#        condition: service_healthy
#        required: false   # don't fail when the "tools" profile is off
    volumes:
      - ${HOME}/Git:/workspace
      - claude-config:/home/claude/.claude
      - docker-sock:/run/dind
      # Optional: reuse your git identity (read-only)
      # - ${HOME}/.gitconfig:/home/claude/.gitconfig:ro

  # Docker-in-Docker: a separate daemon with its own images/containers/networks.
  # Only this sidecar is privileged; the claude box stays unprivileged and reaches the
  # daemon through a unix socket on a shared volume (no TCP port, nothing on the network).
  # Ports published by nested containers are reachable from the box at docker:<port>.
  docker:
    image: docker:dind
    container_name: claude-dind
    privileged: true
    init: true
    # --group=1000: socket is owned by GID 1000 = the claude user's group in the box
    command: ["dockerd", "--host=unix:///run/dind/docker.sock", "--group=1000"]
    volumes:
      - docker-sock:/run/dind
      - docker-data:/var/lib/docker
      # Same path as in the box, so nested bind mounts like `-v /workspace/foo:/x` resolve
      - ${HOME}/Git:/workspace

  # Started only with the "tools" profile: `docker compose --profile tools up -d`
  # (or COMPOSE_PROFILES=tools)
  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine   # same as CI
    profiles: [tools]
    ports:
      - "15672:15672"   # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  claude-config:
  docker-sock:
  docker-data:
